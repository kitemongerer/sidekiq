services:
  # Create a redis instance
  - type: redis
    name: sidekiq-redis
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # Let's create our background worker
  - type: worker
    name: sidekiq-worker
    runtime: ruby
    branch: max/ruby-2.x
    buildCommand: cat /etc/os-release && bundle install
    startCommand: cat /etc/os-release && bundle exec sidekiq -r ./main.rb
    autoDeploy: false
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: sidekiq-redis
          property: connectionString

  # Create the web server hosting sinatra
  - type: web
    name: sinatra-web
    runtime: ruby
    branch: max/ruby-2.x
    buildCommand: cat /etc/os-release && bundle install
    startCommand: cat /etc/os-release && bundle exec ruby main.rb
    autoDeploy: false
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: sidekiq-redis
          property: connectionString
